<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  pdf-block system-font aliases
  ──────────────────────────────────────────────────────────────────────────────
  Maps every font name in the SYSTEM_FONTS list (packages/react/src/fontCatalog.ts) to the closest
  available font installed in the Browserless container.

  Priority: an exact match in the fonts directory always wins; these aliases
  only fire when the requested family is not found verbatim (binding="same"
  means "treat as equivalent metric-wise").

  Installed packages and their available family names:
    fonts-liberation2    → Liberation Sans, Liberation Serif, Liberation Mono
    fonts-dejavu-core    → DejaVu Sans, DejaVu Serif, DejaVu Sans Mono
    fonts-freefont-ttf   → FreeSans, FreeSerif, FreeMono

  Mapping rationale:
    Arial / Helvetica   → Liberation Sans  (Arial metric-clone; near-identical)
    Verdana             → DejaVu Sans      (same wide x-height humanist design)
    Trebuchet MS        → Liberation Sans  (humanist sans; best available match)
    Impact              → FreeSans Bold    (condensed; Free Sans has a narrow cut)
    Georgia             → DejaVu Serif     (screen-optimised old-style serif)
    Times New Roman     → Liberation Serif (Times metric-clone; near-identical)
    Courier New         → Liberation Mono  (Courier metric-clone; exact match)
  ──────────────────────────────────────────────────────────────────────────────
-->
<fontconfig>

  <!-- ── Sans-serif ──────────────────────────────────────────────────────── -->

  <alias binding="same">
    <family>Arial</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>

  <alias binding="same">
    <family>Helvetica</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>

  <!-- DejaVu Sans: wide x-height + generous sidebearings = closest to Verdana -->
  <alias binding="same">
    <family>Verdana</family>
    <accept><family>DejaVu Sans</family></accept>
  </alias>

  <alias binding="same">
    <family>Trebuchet MS</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>

  <!-- Impact is condensed-black; FreeSans has a usable narrow Regular weight -->
  <alias binding="same">
    <family>Impact</family>
    <accept><family>FreeSans</family></accept>
  </alias>

  <!-- ── Serif ────────────────────────────────────────────────────────────── -->

  <alias binding="same">
    <family>Times New Roman</family>
    <accept><family>Liberation Serif</family></accept>
  </alias>

  <!-- DejaVu Serif: old-style screen serif; proportions very close to Georgia -->
  <alias binding="same">
    <family>Georgia</family>
    <accept><family>DejaVu Serif</family></accept>
  </alias>

  <!-- ── Monospace ─────────────────────────────────────────────────────────── -->

  <!-- Liberation Mono is a metric-exact clone of Courier New -->
  <alias binding="same">
    <family>Courier New</family>
    <accept><family>Liberation Mono</family></accept>
  </alias>

</fontconfig>
